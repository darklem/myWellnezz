[tool.poetry]
name = "mywellnezz"
version = "1.2.0"
description = ""
authors = ["AeonDave"]
readme = "README.md"
packages = [
    { include = "mywellnezz" },
    { include = "app", from = "mywellnezz" },
    { include = "models", from = "mywellnezz" },
    { include = "modules", from = "mywellnezz" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
prettytable = "^3.10.0"
colorama = "^0.4.6"
psutil = "^5.9.8"
aiohttp = "^3.9.5"
aioconsole = "^0.7.0"
pillow = "^10.3.0"
pwinput = "^1.0.3"
python-dateutil = "^2.9.0"
loguru = "^0.7.2"
mouse = "^0.7.1"
# Web interface dependencies
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
jinja2 = "^3.1.4"

[tool.poetry.scripts]
mywellnezz = "mywellnezz.main:start"
mywellnezz-web = "mywellnezz.web_app:start"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
